[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "happy-horse-seedance-benchmark"
version = "0.1.0"
description = "Benchmark harness for Happy Horse 1.0, Seedance 2.0, and Seedance 2.0 Fast."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }

[project.scripts]
vbench = "vbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
